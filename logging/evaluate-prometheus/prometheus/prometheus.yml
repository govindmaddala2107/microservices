scrape_configs:
  - job_name: 'consumer'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'consumer'
  - job_name: 'producer'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['host.docker.internal:8081', 'host.docker.internal:8082']
        labels:
          application: 'producer'