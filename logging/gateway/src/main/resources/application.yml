
spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Consumer route
            - id: consumer
#              uri: http://localhost:8080
              uri: lb://CONSUMER
              predicates:
                - Path=/rest-client/**,/api/feign/**,/api/web-client/**,/api/http-interface/**
              filters:
                  - "RewritePath=/rest-client(?<segment>/?.*), /api/rest-client${segment}"
            # Producer route
            - id: producer
              uri: lb://PRODUCER
              predicates:
                - Path=/instance-info/**
            # Route for Eureka Dashboard
            - id: eureka
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/main
              filters:
                - SetPath=/

            # Route for Eureka Static Resources (CSS, JS, fonts, images)
            - id: eureka-server-static
              uri: http://localhost:8761
              predicates:
                - Path=/eureka/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

server:
  port: 5000

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0

  endpoint:
    gateway:
      access: read-only
